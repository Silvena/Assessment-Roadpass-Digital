version: 2.1
commands:
  setup-node-and-dependencies:
    description: Install Node.js dependencies and configure environment
    steps:
      - checkout
      - restore_cache:
          keys:
            - 'v1-node-deps-{{ checksum "package.json" }}'
            - v1-node-deps-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: 'v1-node-deps-{{ checksum "package.json" }}'
          paths:
            - node_modules
      - run:
          name: Install Playwright Browsers
          command: npx playwright install --with-deps
      - run:
          name: Verify Playwright installation
          command: npx playwright --version
  run-playwright-tests:
    description: Run Playwright tests with specified project(s)
    parameters:
      project:
        type: string
        description: 'Playwright project (chromium, firefox, webkit)'
      test-files:
        type: string
        default: tests/
        description: Test file or directory to run
      exclude-quarantine:
        type: boolean
        default: true
        description: Exclude quarantine directory from PR runs
    steps:
      - run:
          name: 'Run Playwright tests [<< parameters.project >>]'
          command: |
            TEST_PATH="<< parameters.test-files >>"
            if [ << parameters.exclude-quarantine >> == "true" ]; then
              EXTRA_FLAGS="--ignore=tests/quarantine/"
            else
              EXTRA_FLAGS=""
            fi

            # Run tests with JUnit reporter from root using npx
            npx playwright test part1-automation/$TEST_PATH \
              --config=part1-automation/playwright.config.js \
              --project=<< parameters.project >> \
              --reporter=list,junit \
              $EXTRA_FLAGS
          no_output_timeout: 10m
  store-test-results:
    description: 'Store JUnit XML, screenshots, videos, and traces'
    steps:
      - store_test_results:
          path: part1-automation/reports/test-results
      - store_artifacts:
          path: part1-automation/reports/test-results
          destination: test-results
      - store_artifacts:
          path: part1-automation/playwright-report
          destination: playwright-report
  post-test-summary-to-pr:
    description: Post test summary comment to GitHub PR
    parameters:
      test-files:
        type: string
        default: tests/
    steps:
      - run:
          name: Post test summary to PR
          command: >
            # Only run on PR builds

            if [ -z "$CIRCLE_PULL_REQUEST" ]; then
              echo "Not a PR build; skipping PR comment"
              exit 0
            fi


            # Extract PR number from URL

            PR_NUMBER=$(echo "$CIRCLE_PULL_REQUEST" | grep -o '[0-9]*$')


            # Parse JUnit XML to get test counts
            JUNIT_FILE="part1-automation/reports/test-results/junit.xml"


            if [ ! -f "$JUNIT_FILE" ]; then
              echo "JUnit XML not found; skipping comment"
              exit 0
            fi


            TOTAL=$(grep -c '<testcase' "$JUNIT_FILE" || echo "0")

            FAILED=$(grep -c '<failure' "$JUNIT_FILE" || echo "0")

            PASSED=$((TOTAL - FAILED))


            COMMENT="## ? Automated Test Results\n\n**Test Suite**: Part 1 - E2E
            Automation\n**Total Tests**: $TOTAL\n**Passed**: ?
            $PASSED\n**Failed**: ? $FAILED\n**Browser**: Chromium (PR
            runs)\n\n**Duration**: ~4?5 minutes\n**Status**: $([ $FAILED -eq 0 ]
            && echo '? ALL PASSED' || echo '? FAILURES')\n\n? [View Full
            Report](https://app.circleci.com/pipelines/github/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/$CIRCLE_BUILD_NUM)\n?
            [Download
            Artifacts](https://app.circleci.com/pipelines/github/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/$CIRCLE_BUILD_NUM/artifacts)\n\n---\n_Generated
            by CircleCI Workflow #$CIRCLE_BUILD_NUM_"


            # Post comment via GitHub API

            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/issues/$PR_NUMBER/comments" \
              -d "{\"body\": \"$COMMENT\"}" > /dev/null

            echo "PR comment posted successfully"
  notify-slack-on-failure:
    description: Send Slack notification on test failure
    steps:
      - run:
          name: Notify Slack on failure
          when: on_fail
          command: |
            if [ -z "$SLACK_WEBHOOK" ]; then
              echo "Slack webhook not configured; skipping notification"
              exit 0
            fi

            PR_LINK=""
            if [ -n "$CIRCLE_PULL_REQUEST" ]; then
              PR_LINK="<$CIRCLE_PULL_REQUEST|PR #$(echo $CIRCLE_PULL_REQUEST | grep -o '[0-9]*$')>"
            fi

            PAYLOAD=$(cat \<<EOF
            {
              "text": "Test Pipeline Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Test Failure Detected*\nBranch: $CIRCLE_BRANCH\n$PR_LINK"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Author*\n$CIRCLE_USERNAME"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Build*\n<$CIRCLE_BUILD_URL|#$CIRCLE_BUILD_NUM>"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View CircleCI"
                      },
                      "url": "$CIRCLE_BUILD_URL"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Artifacts"
                      },
                      "url": "$CIRCLE_BUILD_URL/artifacts"
                    }
                  ]
                }
              ]
            }
            EOF
            )

            curl -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "$PAYLOAD"
jobs:
  setup:
    docker:
      - image: 'cimg/node:22.0'
    steps:
      - setup-node-and-dependencies
      - run:
          name: Global authentication setup
          command: |
            # Run global setup (generates part1-automation/auth/.auth/user.json)
            echo "Running global authentication setup..."
            if ! npx playwright test part1-automation/auth/global.setup.js --config=part1-automation/playwright.config.js 2>&1 | tee /tmp/setup-output.log | grep -q "Auth state saved"; then
              echo "⚠️ Global setup did not report success! Checking output..."
              cat /tmp/setup-output.log
            fi
            
            # Verify auth file exists
            if [ -f "part1-automation/auth/.auth/user.json" ]; then
              echo "✅ Auth session created"
              ls -lh part1-automation/auth/.auth/user.json
            else
              echo "⚠️ Auth session not found; tests will authenticate inline"
              mkdir -p part1-automation/auth/.auth
              echo '{"cookies":[],"origins":[]}' > part1-automation/auth/.auth/user.json
            fi
          no_output_timeout: 10m
      - persist_to_workspace:
          root: .
          paths:
            - part1-automation/auth/.auth/user.json
            - part1-automation/reports/test-results/setup-failure.png
  auth-tests:
    docker:
      - image: 'cimg/node:22.0'
    steps:
      - setup-node-and-dependencies
      - attach_workspace:
          at: .
      - run-playwright-tests:
          project: chromium
          test-files: tests/authpage.spec.js tests/cookie-banner.spec.js
          exclude-quarantine: false
      - store-test-results
      - notify-slack-on-failure
  trip-planning-tests-chromium:
    docker:
      - image: 'cimg/node:22.0'
    steps:
      - setup-node-and-dependencies
      - attach_workspace:
          at: .
      - run-playwright-tests:
          project: chromium
          test-files: >-
            tests/trip-planner-happy-path.spec.js
            tests/trip-planning-edge-cases.spec.js
          exclude-quarantine: true
      - store-test-results
      - post-test-summary-to-pr:
          test-files: >-
            tests/trip-planner-happy-path.spec.js
            tests/trip-planning-edge-cases.spec.js
      - notify-slack-on-failure
  trip-planning-tests-firefox:
    docker:
      - image: 'cimg/node:22.0'
    steps:
      - setup-node-and-dependencies
      - attach_workspace:
          at: .
      - run-playwright-tests:
          project: firefox
          test-files: >-
            tests/trip-planner-happy-path.spec.js
            tests/trip-planning-edge-cases.spec.js
          exclude-quarantine: true
      - store-test-results
      - notify-slack-on-failure
  trip-planning-tests-webkit:
    docker:
      - image: 'cimg/node:22.0'
    steps:
      - setup-node-and-dependencies
      - attach_workspace:
          at: .
      - run-playwright-tests:
          project: webkit
          test-files: >-
            tests/trip-planner-happy-path.spec.js
            tests/trip-planning-edge-cases.spec.js
          exclude-quarantine: true
      - store-test-results
      - notify-slack-on-failure
  quarantine-tests:
    docker:
      - image: 'cimg/node:22.0'
    steps:
      - setup-node-and-dependencies
      - attach_workspace:
          at: .
      - run-playwright-tests:
          project: chromium
          test-files: tests/quarantine/
          exclude-quarantine: false
      - store-test-results
      - run:
          name: Report quarantine test results
          when: always
          command: |
            echo "Quarantine test results stored separately"
            echo "Location: part1-automation/reports/test-results/junit-quarantine.xml"
  api-tests:
    docker:
      - image: 'cimg/node:22.0'
    steps:
      - setup-node-and-dependencies
      - run:
          name: Run API tests (part3)
          command: |
            npx playwright test \
              --config=part3-bonus/playwright-config.js
          no_output_timeout: 5m
      - store_test_results:
          path: part3-bonus/reports/test-results
      - store_artifacts:
          path: part3-bonus/reports/test-results
          destination: api-test-results
      - notify-slack-on-failure
  report-aggregation:
    docker:
      - image: 'cimg/node:22.0'
    steps:
      - checkout
      - run:
          name: Aggregate test reports
          command: >
            echo "=== Test Suite Summary ==="

            echo ""

            echo "? All test jobs completed"

            echo ""

            echo "Reports available at:"

            echo "  ? CircleCI Test Insights:
            https://app.circleci.com/insights/github/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/workflows/test-suite"

            echo "  ? HTML Report: Artifacts > playwright-report/index.html"

            echo "  ? JUnit XML: Artifacts > test-results/junit.xml"
      - store_artifacts:
          path: part1-automation/reports/test-results
          destination: test-results
      - store_artifacts:
          path: part1-automation/playwright-report
          destination: playwright-report
workflows:
  test-pr:
    when:
      and:
        - equal:
            - webhook
            - webhook
        - not:
            equal:
              - main
              - main
    jobs:
      - setup:
          context: roadtrippers-qa
      - auth-tests:
          context: roadtrippers-qa
          requires:
            - setup
      - api-tests:
          context: roadtrippers-qa
          requires:
            - setup
      - trip-planning-tests-chromium:
          context: roadtrippers-qa
          requires:
            - auth-tests
      - report-aggregation:
          requires:
            - trip-planning-tests-chromium
            - api-tests
  test-main:
    when:
      and:
        - equal:
            - webhook
            - webhook
        - equal:
            - main
            - main
    jobs:
      - setup:
          context: roadtrippers-qa
      - auth-tests:
          context: roadtrippers-qa
          requires:
            - setup
      - api-tests:
          context: roadtrippers-qa
          requires:
            - setup
      - trip-planning-tests-chromium:
          context: roadtrippers-qa
          requires:
            - auth-tests
      - trip-planning-tests-firefox:
          context: roadtrippers-qa
          requires:
            - auth-tests
      - trip-planning-tests-webkit:
          context: roadtrippers-qa
          requires:
            - auth-tests
      - report-aggregation:
          requires:
            - trip-planning-tests-chromium
            - trip-planning-tests-firefox
            - trip-planning-tests-webkit
            - api-tests
  test-nightly:
    when:
      equal:
        - scheduled_pipeline
        - scheduled_pipeline
    jobs:
      - setup:
          context: roadtrippers-qa
      - auth-tests:
          context: roadtrippers-qa
          requires:
            - setup
      - api-tests:
          context: roadtrippers-qa
          requires:
            - setup
      - trip-planning-tests-chromium:
          context: roadtrippers-qa
          requires:
            - auth-tests
      - trip-planning-tests-firefox:
          context: roadtrippers-qa
          requires:
            - auth-tests
      - trip-planning-tests-webkit:
          context: roadtrippers-qa
          requires:
            - auth-tests
      - quarantine-tests:
          context: roadtrippers-qa
          requires:
            - setup
      - report-aggregation:
          requires:
            - trip-planning-tests-chromium
            - trip-planning-tests-firefox
            - trip-planning-tests-webkit
            - quarantine-tests
            - api-tests
